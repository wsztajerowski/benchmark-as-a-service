name: E2E Production Benchmark Test

on:
  workflow_dispatch:
  pull_request:

env:
  S3_BUCKET: baas-lynx-main
  JAVA_VERSION: 25
  JAVA_DISTRIBUTION: temurin
  MONGOSH_VERSION: 2.5.8

jobs:
  setup-env:
    name: Setup env
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.identity.outputs.project }}
      async_run_id: ${{ steps.identity.outputs.async_run_id }}
      async_created_at: ${{ steps.identity.outputs.async_created_at }}
      async_result_path: ${{ steps.identity.outputs.async_result_path }}
      prof_run_id: ${{ steps.identity.outputs.prof_run_id }}
      prof_created_at: ${{ steps.identity.outputs.prof_created_at }}
      prof_result_path: ${{ steps.identity.outputs.prof_result_path }}
      java_version: ${{ env.JAVA_VERSION }}
      s3_bucket: ${{ env.S3_BUCKET }}
    steps:
      # One identity per benchmark job, not one shared by both. The two jobs used to write
      # run-status to the same key, so whichever finished last decided what the run "was".
      #
      # Each id's instant is also passed as --created-at, or the one-instant property would hold
      # for `baas run` and quietly fail here — CI's id would disagree with its own stored
      # createdAt by however long the job sat in the queue, and nobody would notice until they
      # compared a prefix name against a timestamp months later.
      #
      # Minting the id in bash is safe because nothing parses it: the format is a readability
      # convention, not a contract.
      - name: Mint one run identity per benchmark job
        id: identity
        run: |
          PROJECT="${GITHUB_REPOSITORY##*/}"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          for job in async prof; do
            INSTANT=$(date -u +'%Y-%m-%dT%H:%M:%S.%3NZ')
            COMPACT=$(date -u -d "$INSTANT" +'%Y%m%dT%H%M%S%3NZ')
            RUN_ID="${COMPACT}-$(openssl rand -hex 4)"
            echo "${job}_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "${job}_created_at=$INSTANT" >> "$GITHUB_OUTPUT"
            echo "${job}_result_path=runs/$PROJECT/$RUN_ID" >> "$GITHUB_OUTPUT"
          done

#  Prepare test artifacts and upload to S3
  prepare-test:
    name: Build
    runs-on: ubuntu-latest
    needs: setup-env
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.WORKFLOW_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build runner and benchmark jars
        run: |
          mvn -f ./pom.xml -q clean package -DskipTests
      # Uploaded into each run's own input/, so one prefix holds the whole run — including the
      # JARs it actually executed. Two runs means two copies; that is the point.
      - name: Upload the runner and benchmark jars into each run's input prefix
        run: |
          BUCKET="${{ needs.setup-env.outputs.s3_bucket }}"
          for path in "${{ needs.setup-env.outputs.async_result_path }}" \
                      "${{ needs.setup-env.outputs.prof_result_path }}"; do
            aws s3 cp ./benchmark-runner/target/benchmark-runner.jar \
              "s3://$BUCKET/$path/input/runner.jar"
            aws s3 cp ./fake-jmh-benchmarks/target/fake-jmh-benchmarks.jar \
              "s3://$BUCKET/$path/input/test-benchmark.jar"
          done

  start-runner:
    name: Runner
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/start-ec2-runner.yml
    with:
      aws-region: ${{ vars.AWS_REGION }}
      subnet-id: ${{ vars.SUBNET_ID }}
      security-group-id: ${{ vars.SECURITY_GROUP_ID }}
      tags: |
        project: baas
        environment: ci-run
    secrets:
      workflow-role-arn: ${{ secrets.WORKFLOW_ROLE_ARN }}
      runner-role-name: ${{ secrets.RUNNER_ROLE_NAME }}
      gha-ec2-pat: ${{ secrets.GHA_EC2_PAT }}

  call-workflow-with-async:
    name: Async Profiler
    needs:
      - setup-env
      - prepare-test
      - start-runner
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/exec-single-benchmark.yml
    with:
      gha-runner-type: ${{ needs.start-runner.outputs.label }}
      java-version: ${{ needs.setup-env.outputs.java_version }}
      benchmark-type: jmh-with-async
      request-id: ${{ needs.setup-env.outputs.async_run_id }}
      results-path: ${{ needs.setup-env.outputs.async_result_path }}
      benchmark-path: "s3://${{ needs.setup-env.outputs.s3_bucket }}/${{ needs.setup-env.outputs.async_result_path }}/input/test-benchmark.jar"
      runner-path: "s3://${{ needs.setup-env.outputs.s3_bucket }}/${{ needs.setup-env.outputs.async_result_path }}/input/runner.jar"
      s3-result-bucket: ${{ needs.setup-env.outputs.s3_bucket }}
      async-profiler-version: ${{ vars.ASYNC_PROFILER_VERSION }}
      parameters: "--project ${{ needs.setup-env.outputs.project }} --created-at ${{ needs.setup-env.outputs.async_created_at }} --tag source=gha-e2e-test-async Incrementing_Synchronized -f 1 -wi 1 -i 1 --async-event=wall --async-output-type=flamegraph,jfr --async-additional-param threads=true"
      ssm-param-prefix: ${{ vars.RESOURCE_NAME_PREFIX || 'baas' }}

  call-workflow-with-profilers:
    name: JHM Profilers
    needs:
      - setup-env
      - prepare-test
      - start-runner
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/exec-single-benchmark.yml
    with:
      gha-runner-type: ${{ needs.start-runner.outputs.label }}
      java-version: ${{ needs.setup-env.outputs.java_version }}
      benchmark-type: jmh-with-prof
      request-id: ${{ needs.setup-env.outputs.prof_run_id }}
      results-path: ${{ needs.setup-env.outputs.prof_result_path }}
      benchmark-path: "s3://${{ needs.setup-env.outputs.s3_bucket }}/${{ needs.setup-env.outputs.prof_result_path }}/input/test-benchmark.jar"
      runner-path: "s3://${{ needs.setup-env.outputs.s3_bucket }}/${{ needs.setup-env.outputs.prof_result_path }}/input/runner.jar"
      s3-result-bucket: ${{ needs.setup-env.outputs.s3_bucket }}
      async-profiler-version: ${{ vars.ASYNC_PROFILER_VERSION }}
      parameters: "--project ${{ needs.setup-env.outputs.project }} --created-at ${{ needs.setup-env.outputs.prof_created_at }} --tag source=gha-e2e-test-profilers Incrementing_Synchronized -f 1 -wi 1 -i 1 --profiler 'gc=churn=false;alloc=false' --profiler 'jfr=stackDepth=20'"
      ssm-param-prefix: ${{ vars.RESOURCE_NAME_PREFIX || 'baas' }}

  stop-runner:
    name: Runner
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/stop-ec2-runner.yml
    needs:
      - start-runner
      - call-workflow-with-async
      - call-workflow-with-profilers
    if: always()
    with:
      label: ${{ needs.start-runner.outputs.label }}
      ec2-instance-id: ${{ needs.start-runner.outputs.ec2-instance-id }}
      aws-region: ${{ vars.AWS_REGION }}
    secrets:
      workflow-role-arn: ${{ secrets.WORKFLOW_ROLE_ARN }}
      gha-ec2-pat: ${{ secrets.GHA_EC2_PAT }}

  verify-test-result:
    name: Verify benchmark results
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    needs:
      - setup-env
      - call-workflow-with-async
      - call-workflow-with-profilers
    env:
      ASYNC_REQUEST_ID: ${{ needs.setup-env.outputs.async_run_id }}
      PROF_REQUEST_ID: ${{ needs.setup-env.outputs.prof_run_id }}
      ASYNC_RESULT_PATH: ${{ needs.setup-env.outputs.async_result_path }}
      PROF_RESULT_PATH: ${{ needs.setup-env.outputs.prof_result_path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.WORKFLOW_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Fetch MongoDB URI from SSM
        run: |
          MONGO_URI=$(aws ssm get-parameter \
            --name "/${{ vars.RESOURCE_NAME_PREFIX || 'baas' }}/mongo/connection-string" \
            --with-decryption --query Parameter.Value --output text \
            --region "${{ vars.AWS_REGION }}")
          echo "MONGO_CONNECTION_STRING=$MONGO_URI" >> "$GITHUB_ENV"
      - name: Download and install mongosh
        run: |
          wget https://downloads.mongodb.com/compass/mongosh-${{ env.MONGOSH_VERSION }}-linux-x64.tgz
          tar -xzf mongosh-${{ env.MONGOSH_VERSION }}-linux-x64.tgz
          chmod +x mongosh-${{ env.MONGOSH_VERSION }}-linux-x64/bin/mongosh
          echo "$PWD/mongosh-${{ env.MONGOSH_VERSION }}-linux-x64/bin" >> $GITHUB_PATH
      # Two prefixes, checked separately. Under the shared path a missing artifact from one job
      # could be masked by the other job having written the same key.
      - name: Verify S3 results
        run: |
          BENCH_DIR=pl.wsztajerowski.fake.Incrementing_Synchronized.incrementUsingSynchronized-Throughput
          .github/test/testing-scripts/verify-s3.sh --bucket "${{ env.S3_BUCKET }}" --key "${{ env.ASYNC_RESULT_PATH }}/jmh-with-async-output.txt" --check-size || exit 1
          .github/test/testing-scripts/verify-s3.sh --bucket "${{ env.S3_BUCKET }}" --key "${{ env.ASYNC_RESULT_PATH }}/environment.json" --check-size || exit 1
          .github/test/testing-scripts/verify-s3.sh --bucket "${{ env.S3_BUCKET }}" --key "${{ env.ASYNC_RESULT_PATH }}/input/test-benchmark.jar" --check-size || exit 1
          .github/test/testing-scripts/verify-s3.sh --bucket "${{ env.S3_BUCKET }}" --key "${{ env.ASYNC_RESULT_PATH }}/$BENCH_DIR/flame-wall-forward.html" || exit 1
          .github/test/testing-scripts/verify-s3.sh --bucket "${{ env.S3_BUCKET }}" --key "${{ env.ASYNC_RESULT_PATH }}/$BENCH_DIR/jfr-wall.jfr" || exit 1
          .github/test/testing-scripts/verify-s3.sh --bucket "${{ env.S3_BUCKET }}" --key "${{ env.PROF_RESULT_PATH }}/jmh-profiler-output.txt" --check-size || exit 1
          .github/test/testing-scripts/verify-s3.sh --bucket "${{ env.S3_BUCKET }}" --key "${{ env.PROF_RESULT_PATH }}/environment.json" --check-size || exit 1
          .github/test/testing-scripts/verify-s3.sh --bucket "${{ env.S3_BUCKET }}" --key "${{ env.PROF_RESULT_PATH }}/$BENCH_DIR/profile.jfr" || exit 1
      - name: Verify MongoDB results
        run: |
          .github/test/testing-scripts/verify-mongo.sh --connection-string "$MONGO_CONNECTION_STRING" --collection "jmh_benchmarks" --key "benchmarkMetadata.tags.source" --value gha-e2e-test || exit 1
          .github/test/testing-scripts/verify-mongo.sh --connection-string "$MONGO_CONNECTION_STRING" --collection "jmh_benchmarks" --key "_id.requestId" --value "${{ env.ASYNC_REQUEST_ID }}" || exit 1
          .github/test/testing-scripts/verify-mongo.sh --connection-string "$MONGO_CONNECTION_STRING" --collection "jmh_benchmarks" --key "_id.requestId" --value "${{ env.PROF_REQUEST_ID }}" || exit 1
          .github/test/testing-scripts/verify-mongo.sh --connection-string "$MONGO_CONNECTION_STRING" --collection "jmh_benchmarks" --key "jmhResult.secondaryMetrics.jfr" || exit 1
