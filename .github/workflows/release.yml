name: Release

on:
  push:
    branches:
      - main

env:
  JAVA_VERSION: 25
  JAVA_DISTRIBUTION: temurin

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance
      packages: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      - name: Build with Maven
        run: mvn -B verify --file pom.xml

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # The preset major is pinned on purpose. conventional-changelog-conventionalcommits@10
      # switched to @conventional-changelog/template and needs conventional-changelog-writer@9+,
      # but @semantic-release/release-notes-generator@14 — the newest stable — pins writer ^8.
      # With v10 the run analyses commits correctly and then dies in generateNotes with
      # 'Missing helper'. v9 is the newest major that renders against writer 8, and it still
      # treats a '!' subject as a major. Don't drop the ^9 until release-notes-generator ships
      # a stable release built on writer 9.
      - name: Install dependencies
        run: npm install --no-save semantic-release @semantic-release/commit-analyzer @semantic-release/exec @semantic-release/github @semantic-release/release-notes-generator 'conventional-changelog-conventionalcommits@^9'

      - name: Generate release configuration
        run: |
          echo "module.exports = {
            branches: ['main'],
            plugins: [
              '@semantic-release/commit-analyzer',
              '@semantic-release/release-notes-generator',
              [
                '@semantic-release/github', 
                {
                  'assets': [
                    {'path': 'benchmark-runner/target/benchmark-runner.jar', 'label': 'benchmark-runner.jar'},
                    {'path': 'benchmark-runner/target/benchmark-runner.jar.sha256', 'label': 'benchmark-runner.jar.sha256'},
                    {'path': 'baas-cli/target/baas-cli.jar', 'label': 'baas-cli.jar'},
                    {'path': 'baas-cli/target/baas-cli.jar.sha256', 'label': 'baas-cli.jar.sha256'},
                    {'path': 'scripts/install.sh', 'label': 'install.sh'}
                  ]
                }
              ],
              [
                '@semantic-release/exec',
                {
                  'prepareCmd': 'mvn --batch-mode versions:set -DnewVersion=\${nextRelease.version} && mvn --batch-mode -DskipTests package && sha256sum benchmark-runner/target/benchmark-runner.jar | cut -d\" \" -f1 > benchmark-runner/target/benchmark-runner.jar.sha256 && sha256sum baas-cli/target/baas-cli.jar | cut -d\" \" -f1 > baas-cli/target/baas-cli.jar.sha256 && sed -i \"s/^BAAS_VERSION_DEFAULT=.*/BAAS_VERSION_DEFAULT=\${nextRelease.version}/\" scripts/install.sh',
                  'publishCmd': 'mvn --batch-mode deploy -DskipTests'
                }
              ]
            ],
            preset: 'conventionalcommits'
          };" > release.config.js

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
