services:
  localstack-baas:
    container_name: "${LOCALSTACK_DOCKER_NAME:-localstack-baas}"
    image: localstack/localstack
    ports:
#      - "127.0.0.1:4510-4559:4510-4559"  # external services port range
      - "4566:4566" # LocalStack Gateway
      - "4572:4572" # S3 Port
      - "4574:4574" # Lambda Port
    environment:
      # LocalStack configuration: https://docs.localstack.cloud/references/configuration/
      - DEBUG=${DEBUG:-0}
      - SERVICES=s3,ssm,dynamodb
    # There is no init container: the bucket, the SSM parameters and now the results table are
    # created by hand. Key schema must match ResultsTable in infra/cf-template-core.yaml.
    #
    #   aws --endpoint-url=http://localhost:4566 --profile localstack dynamodb create-table \
    #     --table-name baas-results --billing-mode PAY_PER_REQUEST \
    #     --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=sk,AttributeType=S \
    #                             AttributeName=gsi1pk,AttributeType=S AttributeName=gsi1sk,AttributeType=S \
    #     --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE \
    #     --global-secondary-indexes \
    #       'IndexName=requestId-index,KeySchema=[{AttributeName=gsi1pk,KeyType=HASH},{AttributeName=gsi1sk,KeyType=RANGE}],Projection={ProjectionType=ALL}'
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
  # Retained for the standalone benchmark-runner deployment, which still supports a user's own
  # MongoDB. BaaS itself no longer stores anything here.
  mongo:
    container_name: mongodb
    image: mongo
    restart: always
    ports:
      - 27017:27017