Parameters:
  ResourceNamePrefix:
    Description: Prefix for all resource names created by this stack.
    Type: String
    Default: "baas"
  UseExistingVpc:
    Description: Set to 'true' to skip networking creation and use existing IDs.
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  ExistingVpcId:
    Description: Existing VPC ID (used when UseExistingVpc=true).
    Type: String
    Default: ""
  ExistingSubnetId:
    Description: Existing subnet ID with outbound internet egress (used when UseExistingVpc=true).
    Type: String
    Default: ""
  ExistingSecurityGroupId:
    Description: Existing security group ID (used when UseExistingVpc=true).
    Type: String
    Default: ""

Conditions:
  CreateNetworking: !Equals [!Ref UseExistingVpc, "false"]

Resources:

  # ─── Networking (created only when UseExistingVpc=false) ─────────────────────

  BaasVpc:
    Type: AWS::EC2::VPC
    Condition: CreateNetworking
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: project
          Value: !Sub ${ResourceNamePrefix}
        - Key: Name
          Value: !Sub ${ResourceNamePrefix}-vpc

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Condition: CreateNetworking
    Properties:
      VpcId: !Ref BaasVpc
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: project
          Value: !Sub ${ResourceNamePrefix}
        - Key: Name
          Value: !Sub ${ResourceNamePrefix}-public-subnet

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateNetworking
    Properties:
      Tags:
        - Key: project
          Value: !Sub ${ResourceNamePrefix}

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateNetworking
    Properties:
      VpcId: !Ref BaasVpc
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateNetworking
    Properties:
      VpcId: !Ref BaasVpc
      Tags:
        - Key: project
          Value: !Sub ${ResourceNamePrefix}

  DefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreateNetworking
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateNetworking
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateNetworking
    Properties:
      VpcId: !Ref BaasVpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PublicRouteTable

  RunnerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateNetworking
    Properties:
      GroupDescription: Benchmark runner security group. No inbound; outbound 443/80/27017 only.
      VpcId: !Ref BaasVpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to GitHub, S3 and AWS APIs
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP for package downloads (yum)
        - IpProtocol: tcp
          FromPort: 27017
          ToPort: 27017
          CidrIp: 0.0.0.0/0
          Description: MongoDB Atlas (Atlas serves clients on 27017, not 443)
      Tags:
        - Key: project
          Value: !Sub ${ResourceNamePrefix}
        - Key: Name
          Value: !Sub ${ResourceNamePrefix}-runner-sg

  # ─── S3 Bucket ────────────────────────────────────────────────────────────────

  S3MainBucket:
    Type: AWS::S3::Bucket
    # Benchmark history outlives any single stack. `baas admin teardown` deletes the
    # bucket only when explicitly asked (--delete-bucket), which empties it first.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub baas-${ResourceNamePrefix}
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          # Uploaded benchmark JARs are re-creatable from source; results under
          # <branch>/<type>/<timestamp>/ are untouched by these rules.
          - Id: expire-uploaded-benchmark-jars
            Status: Enabled
            Prefix: runs/
            ExpirationInDays: 30
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: project
          Value: !Sub ${ResourceNamePrefix}
        - Key: baas-role
          Value: working-bucket

  # ─── IAM ──────────────────────────────────────────────────────────────────────

  RunnerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ResourceNamePrefix}-runner-role
      Path: "/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub ${ResourceNamePrefix}-runner-s3-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::baas-${ResourceNamePrefix}'
                  - !Sub 'arn:${AWS::Partition}:s3:::baas-${ResourceNamePrefix}/*'
        - PolicyName: !Sub ${ResourceNamePrefix}-runner-ec2-terminate-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ec2:TerminateInstances
                Resource: !Sub "arn:${AWS::Partition}:ec2:*:*:instance/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/baas-role: benchmark-runner
        - PolicyName: !Sub ${ResourceNamePrefix}-runner-ssm-mongo-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ResourceNamePrefix}/mongo/connection-string"
      Tags:
        - Key: project
          Value: !Sub ${ResourceNamePrefix}

  RunnerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${ResourceNamePrefix}-runner-role
      Path: /
      Roles:
        - !Ref RunnerRole

  # BaasCliOperatorRole — assumed (via sts:AssumeRole) by whoever runs
  # `baas run`/`baas results`/`baas config` locally. Scoped exactly to this
  # stack's own resources (bucket, RunnerRole, mongo SSM path), which only
  # CloudFormation can do precisely since it knows those ARNs at deploy time.
  # Trust is scoped to the account root — this keeps `baas admin setup`
  # parameter-free, since the stack has no way to know which specific human
  # IAM identity should get operator access. Actual gating happens per-user:
  # grant sts:AssumeRole on this role's ARN only to the identities that should
  # be able to assume it — see infra/README.md.
  OperatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ResourceNamePrefix}-operator-role
      Path: "/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub ${ResourceNamePrefix}-operator-ec2-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:RunInstances
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                Resource: "*"
              - Effect: Allow
                Action: ec2:CreateTags
                Resource: "*"
                Condition:
                  StringEquals:
                    ec2:CreateAction: RunInstances
              - Effect: Allow
                Action: ec2:TerminateInstances
                Resource: !Sub "arn:${AWS::Partition}:ec2:*:*:instance/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/baas-role: benchmark-runner
        - PolicyName: !Sub ${ResourceNamePrefix}-operator-ssm-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ResourceNamePrefix}/mongo/connection-string"
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::parameter/aws/service/ami-amazon-linux-latest/*"
        - PolicyName: !Sub ${ResourceNamePrefix}-operator-s3-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt S3MainBucket.Arn
                  - !Sub "${S3MainBucket.Arn}/*"
        - PolicyName: !Sub ${ResourceNamePrefix}-operator-passrole-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt RunnerRole.Arn
        - PolicyName: !Sub ${ResourceNamePrefix}-operator-cfn-read-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Read-only, and only this stack — enough for `baas config sync` to
              # populate config.yaml, not enough to mutate any stack.
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/baas-${ResourceNamePrefix}/*"
      Tags:
        - Key: project
          Value: !Sub ${ResourceNamePrefix}

Outputs:
  BucketName:
    Value: !Ref S3MainBucket
  S3BucketArn:
    Value: !GetAtt S3MainBucket.Arn
  RunnerRoleName:
    Value: !Ref RunnerRole
  RunnerRoleArn:
    Value: !GetAtt RunnerRole.Arn
  RunnerInstanceProfileName:
    Value: !Ref RunnerInstanceProfile
  OperatorRoleArn:
    Value: !GetAtt OperatorRole.Arn
  SubnetId:
    Value: !If [CreateNetworking, !Ref PublicSubnet, !Ref ExistingSubnetId]
  SecurityGroupId:
    Value: !If [CreateNetworking, !Ref RunnerSecurityGroup, !Ref ExistingSecurityGroupId]
  VpcId:
    Value: !If [CreateNetworking, !Ref BaasVpc, !Ref ExistingVpcId]
