Parameters:
  ResourceNamePrefix:
    Description: Prefix for all resource names created by this stack.
    Type: String
    Default: "baas"
  UseExistingVpc:
    Description: Set to 'true' to skip networking creation and use existing IDs.
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  ExistingVpcId:
    Description: Existing VPC ID (used when UseExistingVpc=true).
    Type: String
    Default: ""
  ExistingSubnetId:
    Description: Existing subnet ID with outbound internet egress (used when UseExistingVpc=true).
    Type: String
    Default: ""
  ExistingSecurityGroupId:
    Description: Existing security group ID (used when UseExistingVpc=true).
    Type: String
    Default: ""

Conditions:
  CreateNetworking: !Equals [!Ref UseExistingVpc, "false"]

Resources:

  # ─── Networking (created only when UseExistingVpc=false) ─────────────────────

  BaasVpc:
    Type: AWS::EC2::VPC
    Condition: CreateNetworking
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: project
          Value: !Sub ${ResourceNamePrefix}
        - Key: Name
          Value: !Sub ${ResourceNamePrefix}-vpc

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Condition: CreateNetworking
    Properties:
      VpcId: !Ref BaasVpc
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: project
          Value: !Sub ${ResourceNamePrefix}
        - Key: Name
          Value: !Sub ${ResourceNamePrefix}-public-subnet

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateNetworking
    Properties:
      Tags:
        - Key: project
          Value: !Sub ${ResourceNamePrefix}

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateNetworking
    Properties:
      VpcId: !Ref BaasVpc
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateNetworking
    Properties:
      VpcId: !Ref BaasVpc
      Tags:
        - Key: project
          Value: !Sub ${ResourceNamePrefix}

  DefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreateNetworking
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateNetworking
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateNetworking
    Properties:
      VpcId: !Ref BaasVpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PublicRouteTable

  RunnerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateNetworking
    Properties:
      GroupDescription: Benchmark runner security group. No inbound, outbound HTTPS only.
      VpcId: !Ref BaasVpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to Atlas, GitHub and AWS APIs
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP for package downloads (yum)
      Tags:
        - Key: project
          Value: !Sub ${ResourceNamePrefix}
        - Key: Name
          Value: !Sub ${ResourceNamePrefix}-runner-sg

  # ─── S3 Bucket ────────────────────────────────────────────────────────────────

  S3MainBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub baas-${ResourceNamePrefix}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: project
          Value: !Sub ${ResourceNamePrefix}
        - Key: role
          Value: working-bucket

  # ─── IAM ──────────────────────────────────────────────────────────────────────

  RunnerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ResourceNamePrefix}-runner-role
      Path: "/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub ${ResourceNamePrefix}-runner-s3-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::baas-${ResourceNamePrefix}'
                  - !Sub 'arn:aws:s3:::baas-${ResourceNamePrefix}/*'
        - PolicyName: !Sub ${ResourceNamePrefix}-runner-ec2-terminate-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ec2:TerminateInstances
                Resource: "arn:aws:ec2:*:*:instance/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/baas-role: benchmark-runner
        - PolicyName: !Sub ${ResourceNamePrefix}-runner-ssm-mongo-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ResourceNamePrefix}/mongo/connection-string"
      Tags:
        - Key: project
          Value: !Sub ${ResourceNamePrefix}

  RunnerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${ResourceNamePrefix}-runner-role
      Path: /
      Roles:
        - !Ref RunnerRole

Outputs:
  BucketName:
    Value: !Ref S3MainBucket
  S3BucketArn:
    Value: !GetAtt S3MainBucket.Arn
  RunnerRoleName:
    Value: !Ref RunnerRole
  RunnerRoleArn:
    Value: !GetAtt RunnerRole.Arn
  RunnerInstanceProfileName:
    Value: !Ref RunnerInstanceProfile
  SubnetId:
    Value: !If [CreateNetworking, !Ref PublicSubnet, !Ref ExistingSubnetId]
  SecurityGroupId:
    Value: !If [CreateNetworking, !Ref RunnerSecurityGroup, !Ref ExistingSecurityGroupId]
  VpcId:
    Value: !If [CreateNetworking, !Ref BaasVpc, !Ref ExistingVpcId]
