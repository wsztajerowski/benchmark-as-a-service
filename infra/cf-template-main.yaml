Parameters:
  ResourceNamePrefix:
    Description: Prefix for all resource names created by this stack.
    Type: String
    Default: "baas"
  OIDCProviderArn:
    Description: ARN of an existing GitHub OIDC provider. Leave empty to create a new one.
    Default: ""
    Type: String
  OIDCAudience:
    Description: Audience for configure-aws-credentials.
    Default: "sts.amazonaws.com"
    Type: String
  GitHubOrg:
    Description: GitHub organisation or username (case-sensitive).
    Default: "wsztajerowski"
    Type: String
  GitHubRepo:
    Description: GitHub repository name (case-sensitive).
    Default: "benchmark-as-a-service"
    Type: String
  UseExistingVpc:
    Description: Set to 'true' to skip networking creation and use existing IDs.
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  ExistingVpcId:
    Description: Existing VPC ID (used when UseExistingVpc=true).
    Type: String
    Default: ""
  ExistingSubnetId:
    Description: Existing subnet ID with outbound internet egress (used when UseExistingVpc=true).
    Type: String
    Default: ""
  ExistingSecurityGroupId:
    Description: Existing security group ID (used when UseExistingVpc=true).
    Type: String
    Default: ""

Conditions:
  CreateOIDCProvider: !Equals [!Ref OIDCProviderArn, ""]
  CreateNetworking: !Equals [!Ref UseExistingVpc, "false"]

Resources:

  # ─── Networking (created only when UseExistingVpc=false) ─────────────────────

  BaasVpc:
    Type: AWS::EC2::VPC
    Condition: CreateNetworking
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: project
          Value: !Sub ${ResourceNamePrefix}
        - Key: Name
          Value: !Sub ${ResourceNamePrefix}-vpc

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Condition: CreateNetworking
    Properties:
      VpcId: !Ref BaasVpc
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: project
          Value: !Sub ${ResourceNamePrefix}
        - Key: Name
          Value: !Sub ${ResourceNamePrefix}-public-subnet

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateNetworking
    Properties:
      Tags:
        - Key: project
          Value: !Sub ${ResourceNamePrefix}

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateNetworking
    Properties:
      VpcId: !Ref BaasVpc
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateNetworking
    Properties:
      VpcId: !Ref BaasVpc
      Tags:
        - Key: project
          Value: !Sub ${ResourceNamePrefix}

  DefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreateNetworking
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateNetworking
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateNetworking
    Properties:
      VpcId: !Ref BaasVpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PublicRouteTable

  RunnerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateNetworking
    Properties:
      GroupDescription: Benchmark runner security group — no inbound, outbound HTTPS only.
      VpcId: !Ref BaasVpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to Atlas, GitHub and AWS APIs
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP for package downloads (yum)
      Tags:
        - Key: project
          Value: !Sub ${ResourceNamePrefix}
        - Key: Name
          Value: !Sub ${ResourceNamePrefix}-runner-sg

  # ─── S3 Bucket ────────────────────────────────────────────────────────────────

  S3MainBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub ${ResourceNamePrefix}-main
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: project
          Value: !Sub ${ResourceNamePrefix}
        - Key: role
          Value: working-bucket

  # ─── IAM ──────────────────────────────────────────────────────────────────────

  WorkflowRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ResourceNamePrefix}-github-actions-workflow-role
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !If
                - CreateOIDCProvider
                - !Ref GithubOidc
                - !Ref OIDCProviderArn
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: !Ref OIDCAudience
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub
                  - "repo:${Org}/${Repo}:*"
                  - Org: !Ref GitHubOrg
                    Repo: !Ref GitHubRepo
      Policies:
        - PolicyName: !Sub ${ResourceNamePrefix}-gha-workflow-ec2-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:RunInstances
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                  - ec2:ReplaceIamInstanceProfileAssociation
                  - ec2:AssociateIamInstanceProfile
                Resource: "*"
              - Effect: Allow
                Action: ec2:TerminateInstances
                Resource: "arn:aws:ec2:*:*:instance/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/baas-role: benchmark-runner
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt RunnerRole.Arn
              - Effect: Allow
                Action: ssm:GetParameters
                Resource: "arn:aws:ssm:*::parameter/aws/service/ami-amazon-linux-latest/*"
              - Effect: Allow
                Action: ec2:CreateTags
                Resource: "*"
                Condition:
                  StringEquals:
                    ec2:CreateAction: RunInstances
        - PolicyName: !Sub ${ResourceNamePrefix}-gha-workflow-s3-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub 'arn:aws:s3:::${ResourceNamePrefix}-main/ci/*'
                  - !Sub 'arn:aws:s3:::${ResourceNamePrefix}-main/runs/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::${ResourceNamePrefix}-main'
      Tags:
        - Key: project
          Value: !Sub ${ResourceNamePrefix}

  RunnerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ResourceNamePrefix}-github-actions-runner-role
      Path: "/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub ${ResourceNamePrefix}-runner-s3-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${ResourceNamePrefix}-main'
                  - !Sub 'arn:aws:s3:::${ResourceNamePrefix}-main/*'
        - PolicyName: !Sub ${ResourceNamePrefix}-runner-ec2-terminate-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ec2:TerminateInstances
                Resource: "arn:aws:ec2:*:*:instance/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/baas-role: benchmark-runner
        - PolicyName: !Sub ${ResourceNamePrefix}-runner-ssm-mongo-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ResourceNamePrefix}/mongo/connection-string"
      Tags:
        - Key: project
          Value: !Sub ${ResourceNamePrefix}

  RunnerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${ResourceNamePrefix}-github-actions-runner-role
      Path: /
      Roles:
        - !Ref RunnerRole

  GithubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOIDCProvider
    DeletionPolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
      Tags:
        - Key: project
          Value: !Sub ${ResourceNamePrefix}
Outputs:
  BucketName:
    Value: !Ref S3MainBucket
  RunnerRoleName:
    Value: !Ref RunnerRole
  RunnerRoleArn:
    Value: !GetAtt RunnerRole.Arn
  RunnerInstanceProfileName:
    Value: !Ref RunnerInstanceProfile
  WorkflowRoleArn:
    Value: !GetAtt WorkflowRole.Arn
  SubnetId:
    Value: !If [CreateNetworking, !Ref PublicSubnet, !Ref ExistingSubnetId]
  SecurityGroupId:
    Value: !If [CreateNetworking, !Ref RunnerSecurityGroup, !Ref ExistingSecurityGroupId]
  VpcId:
    Value: !If [CreateNetworking, !Ref BaasVpc, !Ref ExistingVpcId]
  S3BucketArn:
    Value: !GetAtt S3MainBucket.Arn
