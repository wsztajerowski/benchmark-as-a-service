# The GitHub Actions OIDC identity provider, and nothing else.
#
# Split out from the core stack so the local CLI's identity never needs iam:CreateOIDCProvider —
# `deployer-policy.json` scopes iam:Get*/iam:List* to roles and never to oidc-provider/*, so the
# deployer cannot even enumerate providers. Deploy this by hand, with an identity above the
# deployer. No `baas` command creates, updates, deletes or reads this stack.
#
# Deploy order is provider first: the core stack references this provider's ARN from
# BaasCliOperatorRole's trust policy, and takes it as an opaque parameter value rather than
# looking it up. Nothing here is consumed from, or produced for, the core stack.
#
# The provider is account-global — one per issuer URL per account — so an account that already has
# one for token.actions.githubusercontent.com must reuse its ARN rather than deploy this stack,
# which would fail with EntityAlreadyExists.
#
# WorkflowRole used to live here. It is gone: GitHub Actions now federates directly into
# BaasCliOperatorRole, which the core stack owns and declares. A role-chained session is capped at
# 60 minutes by STS regardless of MaxSessionDuration, against a 7200 s default benchmark timeout —
# and the failure mode was a red job with a good measurement, an un-terminated instance and a full
# EC2 bill. Its only grants OperatorRole lacked existed for the self-hosted runner action and died
# with it.

Parameters:
  ResourceNamePrefix:
    Description: Prefix for all resource names created by this stack.
    Type: String
    Default: "baas"

Resources:

  GithubOidc:
    Type: AWS::IAM::OIDCProvider
    # An identity provider outlives any one stack: the core stack's trust policy references its
    # ARN, so deleting it would break every installation that federates through it.
    DeletionPolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
      Tags:
        - Key: project
          Value: !Sub ${ResourceNamePrefix}

Outputs:
  GithubOidcProviderArn:
    Description: >-
      Pass to `baas admin setup --oidc-provider-arn` to federate a core stack into this provider.
    Value: !Ref GithubOidc
