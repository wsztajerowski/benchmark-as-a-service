Parameters:
  ResourceNamePrefix:
    Description: Prefix for all resource names created by this stack.
    Type: String
    Default: "baas"
  RunnerRoleArn:
    Description: ARN of the RunnerRole from the baas-core stack.
    Type: String
  BucketName:
    Description: Name of the S3 working bucket from the baas-core stack.
    Type: String
  GitHubOrg:
    Description: GitHub organisation or username (case-sensitive).
    Default: "wsztajerowski"
    Type: String
  GitHubRepo:
    Description: GitHub repository name (case-sensitive).
    Default: "benchmark-as-a-service"
    Type: String
  OIDCProviderArn:
    Description: ARN of an existing GitHub OIDC provider. Leave empty to create a new one.
    Default: ""
    Type: String
  OIDCAudience:
    Description: Audience for configure-aws-credentials.
    Default: "sts.amazonaws.com"
    Type: String

Conditions:
  CreateOIDCProvider: !Equals [!Ref OIDCProviderArn, ""]

Resources:

  # ─── GitHub Actions OIDC provider ─────────────────────────────────────────────

  GithubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOIDCProvider
    DeletionPolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
      Tags:
        - Key: project
          Value: !Sub ${ResourceNamePrefix}

  # ─── WorkflowRole — assumed by GHA via OIDC ───────────────────────────────────

  WorkflowRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ResourceNamePrefix}-github-actions-workflow-role
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !If
                - CreateOIDCProvider
                - !Ref GithubOidc
                - !Ref OIDCProviderArn
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: !Ref OIDCAudience
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub
                  - "repo:${Org}/${Repo}:*"
                  - Org: !Ref GitHubOrg
                    Repo: !Ref GitHubRepo
      Policies:
        - PolicyName: !Sub ${ResourceNamePrefix}-gha-workflow-ec2-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:RunInstances
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                  - ec2:ReplaceIamInstanceProfileAssociation
                  - ec2:AssociateIamInstanceProfile
                Resource: "*"
              - Effect: Allow
                Action: ec2:TerminateInstances
                Resource: !Sub "arn:${AWS::Partition}:ec2:*:*:instance/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/baas-role: benchmark-runner
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Ref RunnerRoleArn
              - Effect: Allow
                # Both forms: the core stack's OperatorRole uses the singular, and
                # GetParameter/GetParameters are distinct IAM actions.
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub "arn:${AWS::Partition}:ssm:*::parameter/aws/service/ami-amazon-linux-latest/*"
              - Effect: Allow
                Action: ec2:CreateTags
                Resource: "*"
                Condition:
                  StringEquals:
                    ec2:CreateAction: RunInstances
        - PolicyName: !Sub ${ResourceNamePrefix}-gha-workflow-s3-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${BucketName}/ci/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${BucketName}/runs/*'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${BucketName}/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${BucketName}'
        - PolicyName: !Sub ${ResourceNamePrefix}-gha-workflow-ssm-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ResourceNamePrefix}/mongo/connection-string"
      Tags:
        - Key: project
          Value: !Sub ${ResourceNamePrefix}

Outputs:
  WorkflowRoleArn:
    Description: ARN of the WorkflowRole — set as the WORKFLOW_ROLE_ARN GitHub Actions secret.
    Value: !GetAtt WorkflowRole.Arn
