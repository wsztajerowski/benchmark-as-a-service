# The measurement environment's base, declared.
#
# This file is the ONLY place a base tool version is written down. `baas admin build-image`
# renders it into the base EC2 Image Builder component and bakes one AMI; `baas run` boots from
# that AMI and installs nothing. Changing a tool version here and bumping `imageVersion` is the
# whole workflow for the base — there is no second file to keep in step.
#
# The base is one of three components. An installation may add an extension (an operator-owned
# AWSTOE document, kept in the stack and edited with `baas admin image --extension` /
# `baas admin build-image --extension`), and a BaaS-owned contract runs last and fails the bake if
# anything a BaaS workflow depends on is missing. So the image an installation runs is this file
# plus its extension, and the label on its results says which: `1.3.0` or `1.3.0+ext.<hash>`.
#
# The base's history is git: `git log -p infra/runner-image.yaml` is the archive, and
# `git checkout <sha> -- infra/runner-image.yaml && baas admin build-image` is the way back.
# An extension's only record is the installation's stack.
#
# What this file is NOT: a record of what a given run actually measured on. That is
# <result-path>/environment.json, written per run, and it is strictly richer — it also carries
# the instance type, the CPU model and the versions as they resolved. Compare two runs with
# `baas env diff`, never by reading this file.

# Semantic version of the base. Image Builder's Component is immutable at a given version, so ANY
# edit below needs this bumped too. `baas admin build-image` preflights that and refuses to start
# a ~15-minute build it knows will be rejected. The recipe's and the extension's versions are
# derived by the CLI and never written here.
imageVersion: "1.3.0"

# Exact parent release, never a "latest" selector. A selector would silently re-base the whole
# measurement environment on whatever AWS published that morning — the precise drift this
# file exists to remove. Named by its AMI name rather than its AMI ID because an ID means
# nothing outside one region, while the name resolves to that same release — same kernel, same
# package repository — in every region. `baas admin build-image` resolves it in the stack's
# region and requires exactly one Amazon-owned image.
parentImage:
  amiName: al2023-ami-2023.12.20260803.3-kernel-6.1-x86_64

tools:
  # AL2023 `core` repo package, from the regional S3 mirror — no external Corretto repo is
  # involved, which is what lets change 3 put the build behind a private subnet.
  corretto:
    package: java-25-amazon-corretto-headless
    version: "25.0.4+7-1.amzn2023.1"

  # perf is NOT in the parent AMI (it belongs to no comps group, `ami` included), so JMH's
  # -prof perf / perfnorm / perfasm are broken until it is baked. Not pinned: the RPM is built
  # from one kernel build, so the only right version is the running kernel's, and the base
  # installs exactly that. A pin could only ever disagree with the parent. The contract checks,
  # on the booted image, that perf still matches the kernel — an extension may upgrade it.
  perf:
    package: perf

  # The AWS CLI is not declared: the parent ships it in the AL2023 `ami` group, and the contract
  # checks that it runs. Its version is observed per run in environment.json.

  # Downloaded from GitHub Releases at BAKE time (not run time). installPath must stay in step
  # with the --async-path default in JmhWithAsyncProfilerSubcommand, which resolves
  # <installPath>/lib/libasyncProfiler.so.
  asyncProfiler:
    version: "4.0"
    installPath: /app/async-profiler

# Kernel tunables that move benchmark numbers, declared instead of inherited.
#
# Left to AL2023's defaults these are whatever the base image shipped on the day an instance
# booted — uncontrolled variance sitting directly under a profiler. async-profiler needs the
# first two to walk kernel stacks at all. Applied via /etc/sysctl.d and kernel cmdline at bake
# time, so they are in effect before the first warmup iteration.
kernel:
  # perf_event_open for non-root, with kernel-symbol resolution. Relaxes kernel isolation on
  # an instance that runs arbitrary benchmark JARs — accepted: single-tenant and throwaway.
  # See CLAUDE.md "Accepted risks".
  perfEventParanoid: 1
  kptrRestrict: 0
  # THP "always" is AL2023's default and the one JVMs are tuned against; declared so a future
  # base-image change cannot move it silently.
  transparentHugepages: always
  # Swapping mid-measurement produces an outlier indistinguishable from a real regression.
  swap: disabled
